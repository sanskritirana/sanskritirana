<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Background -->

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#080B10"/>
    <stop offset="55%" stop-color="#0D1117"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>

  <!-- Circuit glow -->

  <filter id="nodeGlow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Stronger glow -->

  <filter id="signalGlow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Grid -->

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path
      d="M 40 0 L 0 0 0 40"
      fill="none"
      stroke="#1F2937"
      stroke-width="1"
      opacity="0.32"
    />
  </pattern>

  <!-- Scan gradient -->

  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
    <stop offset="50%" stop-color="#58A6FF" stop-opacity="1"/>
    <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
  </linearGradient>

  <!-- Circuit line -->

  <linearGradient id="circuitLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#303B49"/>
    <stop offset="50%" stop-color="#3B4655"/>
    <stop offset="100%" stop-color="#303B49"/>
  </linearGradient>

  <clipPath id="screen">
    <rect x="40" y="30" width="1120" height="300" rx="18"/>
  </clipPath>

</defs>

<!-- ====================================================== -->

<!-- BACKGROUND -->

<!-- ====================================================== -->

<rect width="1200" height="360" fill="#05070A"/>

<rect
x="40"
y="30"
width="1120"
height="300"
rx="18"
fill="url(#bg)"
stroke="#263241"
stroke-width="1.5"
/>

<rect
x="40"
y="30"
width="1120"
height="300"
rx="18"
fill="url(#grid)"
clip-path="url(#screen)"
/>

